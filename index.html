<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="src/output.css" rel="stylesheet">
    <title>Virtual Sphere</title>
    <script src="Addworker.js" defer></script>
    <style>
        .formAddContainer {
            display: none;
            justify-content: center;
            align-items: center;
            position: fixed;
            /* top: 3%;
            left: 32%; */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.698);
        }

        /* width de scroll (y) */
        .formAdd::-webkit-scrollbar {
            width: 8px;
        }

        /* track => le brder raduis et bg du scrol qui en arrire */
        .formAdd::-webkit-scrollbar-track {
            background-color: #eee;
            border-radius: 12px;
        }

        /* track => la partie qui je peut changer avec souris */
        .formAdd::-webkit-scrollbar-thumb {
            background-color: #777;
            border-radius: 12px;
        }

        .formAdd::-webkit-scrollbar-thumb:hover {
            background-color: #777;
        }
    </style>

</head>

<body class="h-screen w-screen">
    <main class="flex h-full">
        <aside class="bg-[#A8BBA3] h-137.5  w-72 rounded-b-sm">
            <div class="flex justify-center items-center my-4">
                <h1 class="mainTitle font-black font-bold text-[22px] lora-font">Virtual Sphere</h1>
            </div>
            <div class="slogAndBtnAdd flex flex-col items-center justify-evenly h-30">
                <p class="slogans  font-light text-center">Smart space. Smart teams.</p>
                <button class="btnAddWorker bg-[#e5e5e56f] rounded-[5px] p-1 cursor-pointer">+ Add Worker</button>
            </div>

        </aside>
        <section class="relative flex-1 overflow-hidden">
            <img src="/images/plan-worker.jpg" class="w-full h-full absolute" alt="">
            <div class="grid grid-cols-[1fr_15.6%_1fr_1fr] grid-rows-[1fr_1fr_1fr]  absolute">
                <div
                    class="  w-[24rem] h-46.5   border border-11 border-[#573131]  card flex justify-center items-start">
                    <button class="px-2  text-center rounded-[5px] bg-[#A8BBA3] cursor-pointer ">+</button>
                </div>
                <div
                    class="  h-[105%] col-start-3 col-end-4 border border-11 border-[#573131]  bg-[#f9bcbc4e]  card  flex justify-center items-start">
                    <button class="px-2  text-center rounded-[5px] bg-[#A8BBA3] cursor-pointer ">+</button>

                </div>
                <div
                    class=" h-[105%] col-start-4 col-end-5  border border-11 border-[#573131]  bg-[#f9bcbc4e]  card  flex justify-center items-start">
                    <button class="px-2  text-center rounded-[5px] bg-[#A8BBA3] cursor-pointer ">+</button>

                </div>

                <div
                    class="w-[24rem] h-[196%] border border-11 border-[#573131]  bg-[#f9bcbc4e]  card  flex justify-center items-start">
                    <button class="px-2  text-center rounded-[5px] bg-[#A8BBA3] cursor-pointer ">+</button>

                </div>
                <div
                    class=" h-[102%]   col-start-3 col-end-4 row-start-3 -mt-3 border border-11 border-[#573131]   card  flex justify-center items-start">
                    <button class="px-2  text-center rounded-[5px] bg-[#A8BBA3] cursor-pointer ">+</button>

                </div>
                <div
                    class=" h-[102%]  col-start-4 col-end-5 row-start-3 -mt-3 border border-11 border-[#573131]  bg-[#f9bcbc4e] card  flex justify-center items-start">
                    <button class="px-2  text-center rounded-[5px] bg-[#A8BBA3] cursor-pointer ">+</button>

                </div>
            </div>
        </section>

    </main>
    <div class="formAddContainer">
        <form action=""
            class="formAdd  w-[30rem] h-[90%]   bg-[#a2a4a3b8] flex flex-col text-white  gap-y-3 relative rounded-[5px] overflow-y-auto">
            <img src="images/remove-svgrepo-com.svg"
                class="closeModal absolute w-[33px] left-[27rem] top-[-1px] cursor-pointer" alt="">
            <h2 class="text-center text-2xl font-sans">New worker</h2>
            <div
                class="DivimgView shrink-0  w-36 h-36 bg-gray-200 rounded-[5rem] relative mx-auto border-2   border-dashed  border-gray-500">
                <img src="" alt="none" class="imgVeiw rounded-[123rem] w-[9rem] h-[8.73rem]" style="display: none;">
                <div class="textNoImage placeholder absolute top-[40%] left-[25%] text-black">No image</div>
            </div>
            <div class="flex justify-evenly w-[100%]">
                <input type="text"
                    class="name w-[13rem]  ps-2 h-10 shadow rounded-[5px] bg-[#4e474729] shadow-[0_0_60px_10px_rgba(255,255,255,0.25)] "
                    placeholder="youre name">
                <input type="text"
                    class="email w-[13rem]  ps-2 h-10 shadow rounded-[5px] bg-[#4e474729] shadow-[0_0_60px_10px_rgba(255,255,255,0.25)]"
                    placeholder="maria@gmail.com">
            </div>

            <div class="flex justify-evenly w-[100%]">
                <div class="w-[13rem] flex justify-start">
                    <span
                        class="h-10 py-[9px] px-[6px]  w-[3rem] rounded-bl-2xl  bg-[#4e474729] shadow-[0_0_60px_10px_rgba(255,255,255,0.25)]">+121</span>
                    <input type="text"
                        class="telephone   ps-2 h-10 shadow w-[10rem]  rounded-[5px] rounded-bl-[0px] rounded-tl-[0px] bg-[#4e474729] shadow-[0_0_60px_10px_rgba(255,255,255,0.25)]"
                        placeholder="0699230289">
                </div>

                <select
                    class="role w-[13rem]  ps-2 h-10  rounded-[5px] bg-[#4e474729] shadow-[0_0_60px_10px_rgba(255,255,255,0.25)]"
                    id="">
                    <option value="Receptionnistes">Receptionnistes</option>
                    <option value="TechniciensIT" class="text-black">Techniciens IT</option>
                    <option value="AgentsDeSecurite" class="text-black">Agents De Securite</option>
                    <option value="Manager" class="text-black">Manager</option>
                    <option value="Nettoyage " class="text-black">Nettoyage </option>
                    <option value="Autresroles " class="text-black">Autres rôles </option>
                </select>
            </div>

            <div class="flex justify-center">
                <input type="url"
                    class="urlImag w-1/2  ps-2 h-10  rounded-[5px]  bg-[#4e474729] shadow-[0_0_60px_10px_rgba(255,255,255,0.25)]"
                    placeholder="https://example.com/image.jpg">
            </div>
            <div class="flex justify-evenly items-center">
                <h1 class="font-semibold">avez-vous des experiences ?</h1>
                <button class="bg-[#11310f] p-1 rounded-[5px] text-white cursor-pointer AddExperienceBtn">Add
                    Experience</button>
            </div>


            <!-- <div class="bg-[#9c9999] relative flex flex-col gap-y-4">
                <img src="images/trash-can-solid-full.svg" class=" absolute" style="color: #ff2e38;"/>
                     </div> -->
        </form>
    </div>







</body>

</html>
