<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="src/output.css" rel="stylesheet">
    <title>Virtual Sphere</title>
    <script src="./js/Addworker.js" defer></script>
    <style>

        .formAddContainer {
            display: none;
            justify-content: center;
            align-items: center;
            position: fixed;
            /* top: 3%;
            left: 32%; */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.698);
        }

        /* width de scroll (y) */
        .formAdd::-webkit-scrollbar {
            width: 8px;
        }

        /* track => le brder raduis et bg du scrol qui en arrire */
        .formAdd::-webkit-scrollbar-track {
            background-color: #eee;
            border-radius: 12px;
        }

        /* track => la partie qui je peut changer avec souris */
        .formAdd::-webkit-scrollbar-thumb {
            background-color: #777;
            border-radius: 12px;
        }

        .formAdd::-webkit-scrollbar-thumb:hover {
            background-color: #777;
        }

        .availableworkersbg {
            display: none;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(0 0 0 / 18%);

        }
        .availableworkersList::-webkit-scrollbar {
            width: 8px;
        }

        .availableworkersList::-webkit-scrollbar-track {
            background-color: #eee;
            border-radius: 12px;
        }

        /* track => la partie qui je peut changer avec souris */
        .availableworkersList::-webkit-scrollbar-thumb {
            background-color: #777;
            border-radius: 12px;
        }

        .availableworkersList::-webkit-scrollbar-thumb:hover {
            background-color: #777;
        }
        .modalDetailWorkerBg{
             display: none;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(0 0 0 / 18%);
        }
        .modalDetailWorker .divdetail::-webkit-scrollbar {
            width: 8px;
        }
        .modalDetailWorker .divdetail::-webkit-scrollbar-track {
            background-color: #eee;
            border-radius: 12px;
        }
        .modalDetailWorker .divdetail::-webkit-scrollbar-thumb {
            background-color: #777;
            border-radius: 12px;
        }
        .modalDetailWorker .divdetail::-webkit-scrollbar-thumb:hover {
            background-color: #777;
        }

        /* pour sidebar */
        .workernoUnsignedSide::-webkit-scrollbar {
            width: 8px;
        }

        .workernoUnsignedSide::-webkit-scrollbar-track {
            background-color: #eee;
            border-radius: 12px;
        }

        /* track => la partie qui je peut changer avec souris */
        .workernoUnsignedSide::-webkit-scrollbar-thumb {
            background-color: #777;
            border-radius: 12px;
        }

        .workernoUnsignedSide::-webkit-scrollbar-thumb:hover {
            background-color: #777;
        }

    </style>

</head>

<body class="w-full h-full overflow-hidden">
    <main class="flex h-full w-full">
        <aside
            class="workernoUnsignedSide bg-[#A8BBA3] h-137.5  w-72 rounded-b-sm flex flex-col items-center gap-2 overflow-y-auto pb-7">
            <div class="flex justify-center items-center my-4">
                <h1 class="mainTitle font-black font-bold text-[22px] lora-font">Virtual Sphere</h1>
            </div>
            <div class="slogAndBtnAdd flex flex-col items-center justify-evenly h-30">
                <p class="slogans  font-light text-center">Smart space. Smart teams.</p>
                <button class="btnAddWorker bg-[#655e5e6f] rounded-[5px] p-1 cursor-pointer">+ Add Worker</button>
            </div>
            <div class="listWorkers flex flex-col gap-y-4 ">

            </div>
        </aside>
        <section class="relative flex-1 overflow-hidden ">
            <div class="relative w-full aspect-[16/9] overflow-x-hidden">
            <img src="/images/plan-worker.jpg" class="w-full h-full  " alt="">
            <div class="divMain absolute inset-0">

                <!-- salle de conference -->
                <div class="box1 absolute  " style="top: 1%; left: 0.5%; width: 38.3%; height: 33%;">
                    <div class="flex justify-between mb-3">
                        <button class="btnAddToRooms BtnAddconferenceRom px-2 rounded bg-[#A8BBA3] cursor-pointer">+</button>
                        <h2 class="mr-6 mt-[3px] text-center w-[9rem] bg-[#a8bba3] rounded-[13px]">salle de conference</h2>
                    </div>
                    <div class="DivworkerInRoom  flex justify-around items-center flex-wrap" style="position: absolute;top: 14%;left: 1%;width: 97%;height: 84%;"></div>
                </div>

                <!--salle des serveur -->
                <div class="box2 absolute   " style="top: 1%; left: 54.2%; width: 22.9%; height: 35.7%;">
                    <div class="flex justify-between ">
                        <button class="btnAddToRooms BtnAddServerRom px-2 rounded bg-[#A8BBA3] cursor-pointer">+</button>
                        <h2 class="mr-6 mt-[3px] text-center w-[9rem] bg-[#a8bba3] rounded-[13px]">salle des serveur</h2>
                    </div>
                    <div class="DivworkerInRoom flex justify-around items-center  flex-wrap" style="position: absolute;top: 13%;left: 1%;width: 97%;height: 84%;"></div>
                </div>


                <!--salle de securite -->
                <div class="box3 absolute  " style="top: 1%;left: 77%; width: 23%; height: 35.7%;">
                    <div class="flex justify-between ">
                        <button class="btnAddToRooms BtnAddSecuriteeRom px-2 rounded bg-[#A8BBA3] cursor-pointer">+</button>
                        <h2 class="mr-6 mt-[3px] text-center w-[9rem] bg-[#a8bba3] rounded-[13px]">salle de securite </h2>
                    </div>
                    <div class="DivworkerInRoom flex justify-around items-center  flex-wrap" style="position: absolute;top: 13%;left: 1%;width: 97%;height: 84%;"></div>
                </div>

                <!-- salle reseption -->
                <div class="box4 absolute  " style="top: 34%;left: 0.5%; width: 38.3%; height: 65.7%;">
                    <div class="flex justify-between ">
                        <button class="btnAddToRooms BtnAddreseptionRom px-2 rounded bg-[#A8BBA3] cursor-pointer">+</button>
                        <h2 class="mr-6 mt-[3px] text-center w-[9rem] bg-[#a8bba3] rounded-[13px]">salle de reseption</h2>
                    </div>
                    <div class="DivworkerInRoom flex justify-around items-center  flex-wrap " style="position: absolute;top: 13%;left: 1%;width: 97%;height: 84%;"></div>
                </div>

                <!-- salle des personel -->
                <div class="box5 absolute  " style="top: 66%; left: 55%; width: 23%; height: 34%;">
                    <div class="flex justify-between ">
                        <button class="btnAddToRooms BtnAddPersonelRom px-2 rounded bg-[#A8BBA3] cursor-pointer">+</button>
                        <h2 class="mr-6 mt-[3px] text-center w-[9rem] bg-[#a8bba3] rounded-[13px]">salle des personel </h2>
                    </div>
                    <div class="DivworkerInRoom flex justify-around items-center flex-wrap " style="position: absolute;top: 13%;left: 1%;width: 97%;height: 84%;"></div>
                </div>

                <!-- salle d'archives  -->
                <div class="box6 absolute  " style="top: 66%; left: 77.5%; width: 23%; height: 34%;"
                    data-zone="Autre">
                    <div class="flex justify-between ">
                        <button class="btnAddToRooms BtnAddArchiveRom px-2 rounded bg-[#A8BBA3] cursor-pointer">+</button>
                        <h2 class="mr-6 mt-[3px] text-center w-[9rem] bg-[#a8bba3] rounded-[13px]">salle d'archives </h2>
                    </div>
                    <div class="DivworkerInRoom flex justify-around items-center  flex-wrap" style="position: absolute;top: 13%;left: 0%;width: 97%;height: 84%;"></div>
                </div>

            </div>
            </div>

        </section>
    </main>
    <div class="formAddContainer">
        <form action=""
            class="formAdd  w-[30rem] h-[90%]   bg-[#a2a4a3b8] flex flex-col text-white  gap-y-3 relative rounded-[5px] overflow-y-auto">
            <img src="images/remove-svgrepo-com.svg"
                class="closeModal absolute w-[33px] left-[27rem] top-[-1px] cursor-pointer" alt="">
            <h2 class="text-center text-2xl font-sans">New worker</h2>
            <div
                class="DivimgView shrink-0  w-36 h-36 bg-gray-200 rounded-[5rem] relative mx-auto border-2   border-dashed  border-gray-500">
                <img src="" alt="none" class="imgVeiw rounded-[123rem] w-[9rem] h-[8.73rem]" style="display: none;">
                <div class="textNoImage placeholder absolute top-[40%] left-[25%] text-black">No image</div>
            </div>
            <div class="flex justify-evenly w-[100%]">
                <input type="text"
                    class="name w-[13rem]  ps-2 h-10 shadow rounded-[5px] bg-[#4e474729] shadow-[0_0_60px_10px_rgba(255,255,255,0.25)] "
                    placeholder="youre name">
                <input type="email"
                    class="email w-[13rem]  ps-2 h-10 shadow rounded-[5px] bg-[#4e474729] shadow-[0_0_60px_10px_rgba(255,255,255,0.25)]"
                    placeholder="maria@gmail.com">
            </div>

            <div class="flex justify-evenly w-[100%] select">
                <input type="tel"
                    class="telephone w-[13rem] flex justify-start  ps-2 h-10 shadow w-[10rem]  rounded-[5px] rounded-bl-[0px] rounded-tl-[0px] bg-[#4e474729] shadow-[0_0_60px_10px_rgba(255,255,255,0.25)]"
                    placeholder="0699230289">

                <select
                    class="role w-[13rem]  ps-2 h-10  rounded-[5px] bg-[#4e474729] shadow-[0_0_60px_10px_rgba(255,255,255,0.25)]"
                    id="">
                    <option value="">choisir un role</option>
                </select>
            </div>

            <div class="flex justify-center">
                <input type="url"
                    class="urlImag w-1/2  ps-2 h-10  rounded-[5px]  bg-[#4e474729] shadow-[0_0_60px_10px_rgba(255,255,255,0.25)]"
                    placeholder="https://example.com/image.jpg">
            </div>
            <div class="flex justify-evenly items-center">
                <h1 class="font-semibold">avez-vous des experiences ?</h1>
                <button type="button"
                    class="bg-[#505050] p-1 rounded-[5px] text-white cursor-pointer AddExperienceBtn">Add
                    Experience</button>
            </div>
            <div class="experience">

            </div>
            <button type="submit"
                class="btnSubmit bg-[#505050] p-1 rounded-[5px] text-white cursor-pointer w-57 flex justify-center items-center mx-auto my-2 ">Send</button>

        </form>
    </div>
    <!-- le modal detail worker -->
     <section class="modalDetailWorkerBg">
            <!-- le detail  -->
    </section>
    
    <!-- le modal available worker -->
    <section class="availableworkersbg flex-col">
        <section
            class="availableworkersList  w-80 max-h-103 flex flex-col justify-center items-center bg-[#bbbbbbba] py-5 pt-47 gap-3 relative rounded-[5px] overflow-y-auto">
            <!-- available qorker -->
        </section>
    </section>


</body>

</html>
